<!doctype html><html lang="id" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SONORA</title><meta name="theme-color" content="#0E0F13"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icons/icon-192.png"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="stylesheet" href="css/main.css">
<script>try{var m=localStorage.themeMode||localStorage.theme||'system';document.documentElement.dataset.theme=m==='system'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m}catch(e){}</script></head><body>
<header><h1 id="ttl">Beranda</h1><input id="q" type="search" placeholder="Cari judul, artis, album" aria-label="Cari lagu" hidden><button id="add" aria-label="Tambah musik">＋</button></header>
<nav id="tabs" aria-label="Filter library" hidden><button data-t="songs" class="on">Songs</button><button data-t="fav">Favorites</button><button data-t="albums">Albums</button><button data-t="artists">Artists</button><button data-t="recent">Recent</button></nav>
<main id="main"></main>
<div id="mini" hidden><button id="mo" aria-label="Buka Now Playing"><span id="mc"></span><span><b id="mt"></b><small id="ma"></small></span></button><button id="mpp" aria-label="Play atau pause"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></button><button id="mnx" aria-label="Berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button></div>
<nav id="nav" aria-label="Navigasi utama"><button data-n="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-n="lib"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M15 5l5 14"/></svg>Library</button><button data-n="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button><button data-n="pl"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h9M18 15v6M15 18h6"/></svg>Playlists</button><button data-n="set"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></svg>Settings</button></nav>
<section id="np" hidden aria-label="Now Playing"><div class="top"><button id="npb" aria-label="Kembali">⌄</button><span>Now Playing</span><button id="npq" aria-label="Antrean">☰</button></div><div id="npw"><div id="npc"></div><canvas id="viz" hidden role="button" tabindex="0" aria-label="Visualizer. Ketuk untuk ganti mode"></canvas></div><h2 id="npt"></h2><p id="npa"></p><button id="ninfo" class="qchip" aria-label="Audio Information"><span id="npi"></span><span class="chev" aria-hidden="true">›</span></button><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu"><div class="tm"><span id="cur">0:00</span><span id="tot">0:00</span></div><div class="ctl"><button id="sh" aria-label="Shuffle"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button><button id="pv" aria-label="Sebelumnya"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5h2v14H6zM20 5v14L9.5 12z"/></svg></button><button id="pp" class="big" aria-label="Play atau pause"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 5v14l11-7z"/></svg></button><button id="nx" aria-label="Berikutnya"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5h2v14h-2zM4 5v14l10.5-7z"/></svg></button><button id="rp" aria-label="Ulangi"></button><button id="sp" aria-label="Kecepatan pemutaran">1x</button></div><button id="fv" aria-label="Favorit">♡</button></section>
<div id="sheet" hidden></div><div id="dlg" hidden></div><div id="toast" role="status"></div>
<input id="file" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.aif,.aiff" hidden>
<script>addEventListener("error",function(e){var t=document.getElementById("toast");if(t){t.textContent="Error: "+(e.message||"tidak diketahui");t.className="on"}})</script>
<script type="module" src="js/app.js"></script></body></html>
