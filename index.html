<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SONORA</title><meta name="theme-color" content="#101116"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/icons/icon-192.png"><link rel="stylesheet" href="css/main.css"></head><body>
<header><h1>SONORA</h1><input id="q" type="search" placeholder="Cari judul, artis, album" aria-label="Cari lagu"><button id="add" aria-label="Tambah musik">＋</button><button id="set" aria-label="Pengaturan">⚙</button></header>
<nav id="tabs"><button data-t="songs" class="on">Songs</button><button data-t="fav">Favorites</button><button data-t="pl">Playlists</button></nav>
<main id="main"></main>
<div id="mini" hidden><button id="mo" aria-label="Buka Now Playing"><span id="mc"></span><span><b id="mt"></b><small id="ma"></small></span></button><button id="mpp" aria-label="Play atau pause">▶</button><button id="mnx" aria-label="Berikutnya">⏭</button></div>
<section id="np" hidden aria-label="Now Playing"><div class="top"><button id="npb" aria-label="Kembali">⌄</button><span>Now Playing</span><button id="npq" aria-label="Antrean">☰</button></div><div id="npc"></div><h2 id="npt"></h2><p id="npa"></p><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Posisi lagu"><div class="tm"><span id="cur">0:00</span><span id="tot">0:00</span></div><div class="ctl"><button id="sh" aria-label="Shuffle">⇄</button><button id="pv" aria-label="Sebelumnya">⏮</button><button id="pp" class="big" aria-label="Play atau pause">▶</button><button id="nx" aria-label="Berikutnya">⏭</button><button id="rp" aria-label="Repeat">↻</button></div><button id="fv" aria-label="Favorit">♡</button></section>
<div id="sheet" hidden></div><div id="toast" role="status"></div>
<input id="file" type="file" multiple accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus,.aif,.aiff" hidden>
<script type="module" src="js/app.js"></script></body></html>
